name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openglow-org/forgefirm
          path: forgefirm-layer
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libulfius-dev libjpeg-dev zlib1g-dev libjansson-dev libgnutls28-dev libcrypt-dev rsyslog
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: The served pages' scripts parse (node --check on every bundled script)
        run: python3 -B tools/check_ui_js.py build/ui
      - name: "status_test (the lid and idle reads fail closed; the sys, grbl and lens blocks of /status)"
        run: ./build/status_test
      - name: Dose-curve fitter test
        run: ./build/curverec_fit_test
      - name: sheet_test (the setup sheet renderer)
        run: ./build/sheet_test
      - name: lens_test (the lens frame, every Z inside the controller's window)
        run: ./build/lens_test
      - name: tray_test (the crumb tray's mode, its offset, and what it refuses)
        run: ./build/tray_test
      - name: grblport_test (the controller port's client and its two operation sets)
        run: ./build/grblport_test
      - name: "jobrun_test (the job runner: the lease as a sender, a posted program's check, its M2, its abort; the daemon's own sender under it)"
        run: ./build/jobrun_test

      - name: "tokens_test (scoped tokens: the closed capability list, the judgment, the hash-only store)"
        run: ./build/tokens_test

      - name: auth_scoped_test (the guards' judgment of a scoped token, route by route, and the loopback peer check)
        run: ./build/auth_scoped_test

      - name: "builtin_test (the built-in extensions: the cloud entry, its refusals, its sweep, the list)"
        run: ./build/builtin_test
      - name: "settings_dir_test (the data directory opened for search: the bit added, nothing taken away)"
        run: ./build/settings_dir_test
      - name: "fwproduct_test (the product gate: the firmware paths take firmware only, an extension package never)"
        run: ./build/fwproduct_test

      - name: "lease_test (the machine lease: one holder, nesting, the sender kind)"
        run: ./build/lease_test
      - name: events_test (the event stream's cap, edge detector, and ring)
        run: ./build/events_test
      - name: Log-export sanitizer
        run: ./build/sanitize_test
      - name: "logs_test (the logging tree's paths, the level and target validators, configured against effective levels, the tail)"
        run: ./build/logs_test
      - name: "logs_export_test (the sanitized export: the README, the installer's directory without its addresses, the extension list, no panel token or camera key)"
        run: ./build/logs_export_test
      - name: "fflog_e2e (the logging path: the image's rsyslog.conf and the rendered rules, each logger in its own file at its level, a stray tag in system/, the kern facility in kernel/)"
        run: sudo sh tests/fflog_e2e.sh build forgefirm-layer/meta-forgefirm/recipes-extended/rsyslog/rsyslog/rsyslog.conf
      - name: "host_start (the built daemon on a host: its machine paths in a temporary directory, one read answered, no controller started, iw not run)"
        run: sh tests/host_start.sh build
      - name: "The image's ulfius for host_routes (the recipe's revision and patch: a request carries the whole peer address)"
        run: sh tests/ulfius_image.sh forgefirm-layer/meta-forgefirm/recipes-extended/ulfius build/ulfius-image
      - name: "host_routes (the controller up on a host: the report channel and its secret, the event streams' cap, the motion routes to the port, the extension and setup routes)"
        run: sh tests/host_routes.sh build build/ulfius-image/lib
      - name: "host_setup (the setup gate and its consents on a host: each reason the gate holds, the advisories, the extensions' consent, cloud mode off)"
        run: sh tests/host_setup.sh build build/ulfius-image/lib
      - name: Raw-frame narrowing and Bayer phase
        run: ./build/debayer_test
      - name: Motion gate enclosure read
        run: ./build/enclosure_wait_test
      - name: Controller-mode supervisor
        run: ./build/super_test
      - name: Capture frame-health ladder
        run: ./build/camhealth_test
      - name: Gate settings table
        run: ./build/cool_gate_test
      - name: "cool_flow_test (the cooling engine: the flow check, the tiers, extension holds, the verified fan writes, the intakes fitted)"
        run: ./build/cool_flow_test
      - name: "holds_test (an extension package's holds as the engine reads them: what stands, what is dropped, what reaches the verdict)"
        run: ./build/holds_test
      - name: "extpkg_test (the package routes' relay to the extension host: an argument vector, a closed list of actions, the host's words)"
        run: ./build/extpkg_test
      - name: "mcode_test (the M-code relay: the table from the host's status, the host's mcode command, the answer line in the port's form, the daemon set)"
        run: ./build/mcode_test
      - name: "senderout_test (an extension keeps the Grbl sender out: the claim and its refusals, the package's, the operator's and a stale keeper's end, the controller brought back in line)"
        run: ./build/senderout_test
      - name: "wizpkg_test (a package's check on the Setup page: each step held to its form, the check run through the host, the result the package's own)"
        run: ./build/wizpkg_test
      - name: Airflow gate
        run: ./build/airflow_test
      - name: Crash-watch tiers
        run: ./build/accel_test
      - name: Lens hall-edge reference
        run: ./build/lenshome_test
      - name: Cooling status document
        run: ./build/coolfmt_test
      - name: Fragmented-MP4 muxer
        run: ./build/mp4mux_test
      - name: Digest primitives (SHA-256, HMAC, constant-time compare)
        run: ./build/sha256_test
      - name: Setup sheet id
        run: ./build/sheetid_test
      - name: Setup record and gate
        run: ./build/setup_test
      - name: Setup record as a page
        run: ./build/recordhtml_test
      - name: Account and sessions
        run: ./build/users_test
      - name: Self-signed certificate
        run: ./build/tls_test
      - name: Dark wizard decisions
        run: ./build/wizcalc_test
      - name: Camera key
        run: ./build/camkey_test
      - name: Published-release check (the tag from the first hop)
        run: ./build/relcheck_test
      - name: "test_routes (every panel route registered, every route's capability, the page policy)"
        run: python3 -B -m unittest -v tests/test_routes.py
